# wolfSSL with the shared ese_2026 settings
CONFIG_WOLFSSL=y
CONFIG_WOLFSSL_BUILTIN=y
CONFIG_WOLFSSL_SETTINGS_FILE="ese_user_settings.h"
CONFIG_ENTROPY_GENERATOR=y

# Networking: IPv4/TCP sockets only
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=n
CONFIG_NET_SOCKETS=y
# Back-to-back handshakes leave closed connections in TIME_WAIT; each holds a slot.
CONFIG_NET_MAX_CONN=32
CONFIG_NET_MAX_CONTEXTS=34
CONFIG_ZVFS_OPEN_MAX=16
CONFIG_NET_TCP_TIME_WAIT_DELAY=100

# Buffers sized for ~55 KB SLH-DSA flights
CONFIG_NET_BUF_DATA_SIZE=1536
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_PKT_RX_COUNT=48
CONFIG_NET_PKT_TX_COUNT=48

# Memory and threads
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_THREAD_STACK_INFO=y

CONFIG_LOG=y
CONFIG_PRINTK=y
